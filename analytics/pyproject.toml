[project]
name = "analytics"
version = "0.1.0"
description = "Analytics consumer: daily payment totals with Redis fast-path dedupe"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-psycopg>=0.66b2",
    "opentelemetry-instrumentation-redis>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
]

[project.scripts]
analytics = "analytics:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
